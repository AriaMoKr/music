# Publishes music's site, https://ariamokr.github.io/music/, to GitHub Pages: the static site
# (tools/build-pages.mjs: the client without the Node server) with its demo set and any prebuilt
# indexes, on every push to main or by hand.
#
# The demo set (tools/demo-set.txt) is on the site itself, readable without Kiwix's mirrors or a
# proxy: part pre-rendered (--zims: JSON files, read without the browser's worker), part as the ZIM
# files themselves (--zim-files: opened in the browser with each visit, with their indexes). Here
# it is Gutenberg's Music class alone, pre-rendered with its MIDI files: ~810 MB. Its MP3s stay
# in the ZIM on Kiwix's mirror, read by their byte range (--sources).
#
# Prebuilt indexes (tools/build-indexes.mjs, tools/indexes.txt): for big Wikipedias and
# Wikisources a visitor opens from the web (Kiwix's library), which would otherwise need a build
# reading most of the file. Every run ships what this repo has: the indexes kept in its Actions
# cache by earlier runs and the assets of its release "indexes" (built on a PC: node
# tools/build-indexes.mjs --zims <folder>, then gh release upload indexes .indexes/*.json
# --clobber), less old editions, as many as fit in the site's budget (950 MB in all: Pages
# publishes at most 1 GB), the smallest first. The missing ones are built from Kiwix's mirror by
# another workflow, indexes.yml (by hand, up to 5 h), apart from this one so that a push is
# published at once; it starts this one when it has new ones. None of it is needed: without an
# index a big Wikipedia from the web is listed as needing one, and every ZIM still opens from a
# file. This repository has no release "indexes" yet, so its site ships none.
#
# The edge proxy (tools/zim-proxy/, optional): with the repository variable ZIM_PROXY set to its
# address, the page reads Kiwix's files through it, from the mirror nearest each visitor. This
# repository sets none, so the page reads Kiwix's own mirror directly.
#
# music began as a fork of vrlbry (AriaMoKr/vrlbry, https://ariamokr.github.io/vrlbry/) and loads
# nothing from its site: its demo set and indexes are its own, so either site can go without the
# other noticing. Both are on one origin and share a visitor's localStorage and IndexedDB.
#
# One-time setup: the repository's Settings → Pages → Build and deployment → Source: GitHub Actions.
name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; a newer push waits rather than cancelling one in progress.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      # The demo set, cached until the list changes: pre-rendered ones in .demo/render, the ZIMs
      # shipped as files in .demo/files (a line's second word "file").
      - uses: actions/cache@v6
        with:
          path: .demo
          key: demo-set-${{ hashFiles('tools/demo-set.txt') }}
      - name: Download the demo set
        run: |
          mkdir -p .demo/render .demo/files
          while read -r url form _; do
            case "$url" in ''|'#'*) continue ;; esac
            dir=.demo/render
            [ "$form" = file ] && dir=.demo/files
            file="$dir/$(basename "$url")"
            [ -f "$file" ] || curl -fsSL --retry 3 -o "$file" "$url"
          done < tools/demo-set.txt
          ls -l .demo/render .demo/files
      - name: Build the site
        env:
          ZIM_PROXY: ${{ vars.ZIM_PROXY }}
        run: npm run build:pages -- --zims .demo/render --sources tools/demo-set.txt --zim-files .demo/files ${ZIM_PROXY:+--zim-proxy "$ZIM_PROXY"}
      # Prebuilt indexes: the cache (indexes.yml's builds) and the release's assets.
      - uses: actions/cache/restore@v6
        with:
          path: .indexes
          key: indexes-${{ github.run_id }}
          restore-keys: indexes-
      - name: Prebuilt indexes published as release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p .indexes
          gh release download indexes --repo "$GITHUB_REPOSITORY" --dir .indexes --pattern '*.v*.json' --skip-existing \
            || echo "No release \"indexes\" (or nothing new in it)."
      # Kiwix's catalogue out of reach does not stop the deploy.
      - name: Drop the indexes of editions no longer current
        continue-on-error: true
        run: node tools/build-indexes.mjs --out .indexes --prune
      - name: Ship the prebuilt indexes (as many as fit)
        run: |
          node tools/build-indexes.mjs --out .indexes --ship dist --budget-mb 950
          du -sh dist
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist
          include-hidden-files: true

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
